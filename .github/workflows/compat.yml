name: compat

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/dsh-core
            src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: rustfmt
        run: |
          cargo fmt --manifest-path crates/dsh-core/Cargo.toml --check
          cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: |
          cargo clippy --manifest-path crates/dsh-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: unit tests (core)
        run: cargo test --manifest-path crates/dsh-core/Cargo.toml

      - name: unit tests (shell)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: frontend syntax
        run: node --input-type=module --check < web/main.js

      # The marketplace stub tests itself against a stand-in release server on
      # loopback, so no leg here needs network access to GitHub.
      - name: marketplace stub tests
        run: node --test plugins/dsh-desktop-app/test/plugin.test.js

      - name: bilingual docs
        run: node scripts/check-docs.mjs

      # Unit tests do not link the GUI, so a broken webkit2gtk dependency or a
      # bad tauri configuration would otherwise only surface at tag time.
      - name: release build links the GUI
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

  # `static` compiles the harness on Linux only, so a platform-specific mismatch
  # — a type that is `Send + Sync` on one platform and not on another — would
  # sail through every check and only fail while bundling a release. That is
  # exactly what `global-hotkey`'s Windows manager did: a bare `HWND`, neither
  # `Send` nor `Sync`, so it could not be Tauri managed state on Windows alone.
  cross-compile:
    name: harness compiles on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check (harness)
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

  boot-check:
    name: dsh ${{ matrix.dsh-spec }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A guard on top of the code's own deadline: a leg that hangs must cost
    # minutes, not the default six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Pin the declared compatibility line independently from the moving
        # latest channel, so a regression is attributable to a known build.
        dsh-spec: ['@0.1.5-rc.1', '@latest']
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/dsh-core

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: install dsh
        shell: bash
        run: |
          # A version can appear in the registry's metadata before its tarball
          # has propagated to every CDN edge, and that surfaces as a 404 on a
          # transitive tarball rather than on the package itself. It is
          # transient and has nothing to do with this repository, so the install
          # is retried instead of failing the matrix outright.
          for attempt in 1 2 3 4; do
            if npm i -g "@deepseek-ai/dsh${{ matrix.dsh-spec }}"; then
              exit 0
            fi
            echo "::warning::install attempt ${attempt} failed; retrying in 20s"
            sleep 20
          done
          echo "::error::could not install @deepseek-ai/dsh${{ matrix.dsh-spec }}"
          exit 1

      - name: report the host version under test
        shell: bash
        run: |
          # `npm root -g` is a Windows path on Windows. Handing it to node
          # through the environment and joining it there avoids interpolating
          # backslashes into a JS string literal, where they would be read as
          # escapes — which is what broke this step on windows-latest.
          version="$(DSH_NPM_ROOT="$(npm root -g)" node -e "
            const path = require('node:path');
            const manifest = path.join(process.env.DSH_NPM_ROOT, '@deepseek-ai', 'dsh', 'package.json');
            process.stdout.write(require(manifest).version);
          ")"
          echo "dsh host under test: $version (${{ matrix.dsh-spec }})"

      # This is the shell's own discovery path: port band, token read from the
      # server log, two-step handshake, then a spawned server that must outlive
      # the process which started it. The handshake is walked in Rust, so what
      # comes back is a prepared session — a clean URL plus the cookie that opens
      # it — and not a token URL for the page to finish itself.
      - name: discovery, spawn and handshake
        shell: bash
        run: |
          set -euo pipefail
          # The example leaves a detached server behind. On Windows a detached
          # child inherits the parent's inheritable handles, and that includes
          # the write end of a stdout pipe, so piping into `tail` never sees EOF
          # and hangs until the job is cancelled. A file handle is held just as
          # harmlessly and lets the parent exit.
          out="$RUNNER_TEMP/launch.out"
          # A launch that never reaches the parse below used to fail this step
          # with an empty log: its progress and its reason go to the redirect,
          # and only the *later* checks printed that file. So every failure path
          # now prints the redirect, and the server's own stderr with it — a dsh
          # that refuses to boot says so there and nowhere else.
          fail() {
            echo "::error::$1"
            echo "──── launch ────"
            cat "$out" || true
            for log in "${DSH_HOME:-$HOME/.dsh}"/launcher/logs/server-*.err.log; do
              [ -f "$log" ] || continue
              echo "──── ${log##*/} ────"
              tail -n 40 "$log" || true
            done
            exit 1
          }
          cargo run --quiet --manifest-path crates/dsh-core/Cargo.toml --example launch > "$out" 2>&1 \
            || fail "the launch exited non-zero"
          url="$(sed -n 's/^url=//p' "$out" | tail -n1)"
          cookie="$(sed -n 's/^cookie=//p' "$out" | tail -n1)"
          echo "resolved: $url"
          echo "cookie:   ${cookie:+<present>}"

          case "$url" in
            http://127.0.0.1:*'/') ;;
            *) fail "the session URL is not a clean loopback address: $url" ;;
          esac
          # The launch token must have been consumed in Rust. If it is still in
          # the URL then the handshake was handed to the page instead, which is
          # the thing this design exists to prevent.
          case "$url" in
            *'?token='*) fail "the launch token leaked into the URL: $url" ;;
          esac
          [ -n "$cookie" ] || fail "no session cookie: the token handshake did not complete"

          html="$RUNNER_TEMP/dsh-shell.html"
          status="$(curl -sS --noproxy '*' -H "Cookie: $cookie" -o "$html" -w '%{http_code}' "$url")"
          [ "$status" = 200 ] || {
            echo "::error::the shell answered $status to the session cookie"
            cat "$html" || true
            exit 1
          }
          grep -q 'DeepSeek Harness' "$html" || {
            echo '::error::the shell marker is missing'
            head -c 400 "$html" || true
            exit 1
          }

          # The same address without the cookie must still be refused, which is
          # what makes the cookie the thing that was actually proved.
          bare="$(curl -sS --noproxy '*' -o /dev/null -w '%{http_code}' "$url")"
          [ "$bare" = 401 ] || {
            echo "::error::an unauthenticated request answered $bare instead of 401"
            exit 1
          }
          echo 'discovery, spawn and handshake passed'

      - name: a second launch reuses the running server
        shell: bash
        run: |
          set -euo pipefail
          launch() {
            local file="$RUNNER_TEMP/launch-$1.out"
            cargo run --quiet --manifest-path crates/dsh-core/Cargo.toml --example launch \
              > "$file" 2>&1 || {
                echo "::error::the $1 launch exited non-zero"
                cat "$file" || true
                return 1
              }
            sed -n 's/^url=//p' "$file" | tail -n1
          }
          first="$(launch first)"
          second="$(launch second)"
          echo "first:  $first"
          echo "second: $second"
          [ "$first" = "$second" ] || {
            echo '::error::the second launch did not reuse the running server'
            exit 1
          }
          echo 'reuse passed'
