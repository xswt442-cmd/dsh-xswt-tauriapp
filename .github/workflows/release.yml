name: release

# A release updates the three version fields and both changelogs, then tags the
# release commit as vX.Y.Z. This workflow verifies that contract, builds the
# bundles for every supported platform, and publishes them on the GitHub
# release.
#
# Unlike the sibling plugin repositories, the release *is* the distribution
# channel here: nothing lands on npm, so the artifacts have to be attached and
# the notes have to tell a visitor how to install them.

on:
  push:
    tags: ['v*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Runs once, not per platform: the tag contract and the test suite do not
  # depend on the host, and a release should not be gated four times over.
  verify:
    name: verify the release commit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The shell tests link the GUI, so the toolchain is needed even here.
      - name: install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/dsh-core
            src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: tag matches every declared version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          conf="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          app="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -n1)"
          core="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/dsh-core/Cargo.toml | head -n1)"
          # Both crates carry the repository version: the core crate is not
          # published on its own, so a second version line would only ever drift.
          for pair in "package.json:$pkg" "src-tauri/tauri.conf.json:$conf" \
                      "src-tauri/Cargo.toml:$app" "crates/dsh-core/Cargo.toml:$core"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ "$value" != "$tag" ]; then
              echo "::error::$name declares $value but the tag is $tag"
              exit 1
            fi
          done
          echo "all four version fields agree on $tag"

      - name: tests
        run: |
          cargo test --manifest-path crates/dsh-core/Cargo.toml
          cargo test --manifest-path src-tauri/Cargo.toml --lib
          node scripts/check-docs.mjs

  build:
    name: bundle ${{ matrix.artifact }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        # Every leg names its target explicitly, including the native ones, so
        # the build steps need no conditional. A missing matrix key evaluates to
        # null rather than to the empty string, and `null != ''` is true, so a
        # guard written the obvious way would run the cross-target step on the
        # legs that have no target at all.
        include:
          # 22.04 is Tauri's recommended baseline: it ships libwebkit2gtk-4.1-dev
          # in its own repositories, and building the AppImage there keeps its
          # glibc floor lower than a build on a newer runner would.
          - { os: ubuntu-22.04,   bundles: 'deb,rpm,appimage', artifact: linux-x64,     target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, bundles: 'nsis',             artifact: windows-x64,   target: x86_64-pc-windows-msvc }
          # Both macOS architectures come from the arm64 runner, rather than
          # depending on the x64 image, which is on its way out.
          - { os: macos-latest,   bundles: 'dmg',              artifact: macos-arm64,   target: aarch64-apple-darwin }
          - { os: macos-latest,   bundles: 'dmg',              artifact: macos-x64,     target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/dsh-core
            src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        with:
          version: 12

      # Harmless for a native target, required for the second macOS one.
      - name: add the build target
        shell: bash
        run: rustup target add "${{ matrix.target }}"

      - name: install frontend tooling
        run: pnpm install --frozen-lockfile

      - name: build bundles
        shell: bash
        run: |
          set -euo pipefail
          pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}"

      - name: collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # One expression covers both layouts: with --target the bundle lands
          # under target/<triple>/release/, without it under target/release/.
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) \
            -exec cp {} dist/ \;
          [ -n "$(ls -A dist)" ] || { echo '::error::no bundle was produced'; exit 1; }
          ls -l dist

      - uses: actions/upload-artifact@v6
        with:
          name: bundles-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish the release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the release and attach assets
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist

      - name: checksums
        shell: bash
        run: |
          set -euo pipefail
          # Computed once, here, rather than per platform: macOS ships
          # `shasum -a 256` rather than `sha256sum`, and one file covering every
          # artifact is easier to verify than four.
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%P\0' \
            | sort -z | xargs -0 sha256sum -- > SHA256SUMS
          cat SHA256SUMS

      - name: release notes from the changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo '## 安装'
            echo
            echo '| 平台 | 文件 |'
            echo '|---|---|'
            echo '| Windows | `*-setup.exe` |'
            echo '| macOS | `*.dmg` |'
            echo '| Debian / Ubuntu | `*_amd64.deb` |'
            echo '| Fedora / RHEL | `*.rpm` |'
            echo '| 任意 Linux | `*.AppImage` |'
            echo
            echo '```sh'
            echo "# Debian / Ubuntu"
            echo "sudo apt install ./dsh-xswt-tauriapp_${version}_amd64.deb"
            echo "# Fedora / RHEL"
            echo "sudo dnf install ./dsh-xswt-tauriapp-${version}-1.x86_64.rpm"
            echo "# AppImage"
            echo "chmod +x ./dsh-xswt-tauriapp_${version}_amd64.AppImage && ./dsh-xswt-tauriapp_${version}_amd64.AppImage"
            echo '```'
            echo
            echo 'macOS 构建未签名，首次打开需右键 →「打开」，或执行'
            echo '`xattr -dr com.apple.quarantine /Applications/dsh-xswt-tauriapp.app`。'
            echo
            echo '下载后可用 `sha256sum -c SHA256SUMS` 校验完整性。'
            echo
            echo '---'
            echo
            node scripts/release-notes.mjs "$version"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      # Not gated on anything upstream being absent: a tag pushed before the
      # release exists still needs its notes here, and re-running after a
      # partial failure must converge rather than fail over an existing release.
      - name: create or refresh the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$(cat "$RUNNER_TEMP/notes.md")"
          # A prerelease version string marks the release as one, so an rc or
          # alpha tag never presents itself as the recommended download.
          case "$version" in
            *-*) prerelease=1 ;;
            *)   prerelease=0 ;;
          esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::warning::release ${GITHUB_REF_NAME} already exists - refreshing its assets and notes"
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            if [ "$prerelease" = 1 ]; then
              gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" --prerelease
            else
              gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
            fi
          elif [ "$prerelease" = 1 ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" --prerelease dist/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes" dist/*
          fi
