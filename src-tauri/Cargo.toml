[package]
name = "dsh-xswt-tauriapp"
version = "0.0.4"
description = "A lightweight Tauri shell for DeepSeek Harness — finds or starts a local `dsh web` server, embeds it, and offers dsh updates on launch."
edition = "2021"
license = "MIT"
default-run = "dsh-xswt-tauriapp"

[lib]
name = "dsh_xswt_tauriapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dsh-xswt-tauriapp-core = { path = "../crates/dsh-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
