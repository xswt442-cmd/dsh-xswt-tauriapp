[package]
name = "dsh-xswt-tauriapp"
version = "0.0.12"
description = "A lightweight Tauri shell for DeepSeek Harness — finds or starts a local `dsh web` server, embeds it, and offers dsh updates on launch."
edition = "2021"
license = "MIT"
default-run = "dsh-xswt-tauriapp"

[lib]
name = "dsh_xswt_tauriapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is the Windows/Linux half of the menu story: a tray menu carries
# reload/zoom/DevTools there instead of a menu bar that would eat the dsh
# window's height. `devtools` makes the WebView inspector reachable at all; the
# shell still gates the menu item. `image-png`/`image-ico` decode the bundled
# icons for the tray.
tauri = { version = "2", features = ["tray-icon", "devtools", "image-png", "image-ico"] }
# Tauri can only bind a keyboard shortcut through a menu accelerator, and a menu
# on Windows/Linux is a visible bar. This is the way to have shortcuts without
# one; the shell registers them only while its own window is focused. Used
# directly rather than through tauri-plugin-global-shortcut: the plugin builds its
# hotkey manager in its own setup and fails application startup when the desktop
# refuses, which a Wayland session does.
global-hotkey = "0.8"
# A second launch has to find the first one and raise *its* window, rather than
# open a second window onto the same dsh. Finding it is half the job and a lock
# file would do that half; the other half is saying something to it, which needs a
# channel. A local socket is that channel — a named pipe on Windows, a Unix-domain
# socket elsewhere — and this is the crate for it.
#
# Used directly rather than through `tauri-plugin-single-instance`: that plugin's
# Linux half is `zbus`, which is 33 crates of async machinery for one message, and
# its setup unwraps the session connection, so a desktop with no session bus
# panics — in a release build (`panic = "abort"`) the shell would simply be gone.
# A convenience must never be able to do that. This crate needs no feature at all
# by default, and the failure path is ours to write: not claiming the name costs
# the feature, never the launch.
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dsh-xswt-tauriapp-core = { path = "../crates/dsh-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
