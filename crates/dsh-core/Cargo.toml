[package]
name = "dsh-xswt-tauriapp-core"
version = "0.0.4"
edition = "2021"
description = "Shell-agnostic core for a DSH desktop wrapper: dsh web discovery, the token handshake, server lifecycle and the update-channel report. No GUI dependency, so it builds and tests without webkit2gtk."
license = "MIT"

[lib]
name = "dsh_xswt_tauriapp_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
regex = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"
